name: Tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  python-and-js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r tools/requirements.txt
      - run: cd tools && python -m pytest -q tests
      - run: cd tools && python validate.py --sessions 2 --duration 600 --scenarios baseline,glassy
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node web/test/compare.mjs web/sample/synthetic.fit web/test/expected_jumps.csv
