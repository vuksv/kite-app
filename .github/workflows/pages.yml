# Publishes the report app to GitHub Pages: https://vuksv.github.io/kite-app/
# Works with either Pages source: "GitHub Actions" (this workflow) or "Deploy from a branch"
# (the root index.html redirects to web/).
name: Deploy report app to GitHub Pages
on:
  push:
    branches: [main]
    paths: ["web/**", "index.html", "docs/**", ".github/workflows/pages.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Stage site (app at the root, also under /web, docs alongside)
        run: |
          mkdir -p _site/web _site/docs
          cp -r web/. _site/
          cp -r web/. _site/web/
          cp -r docs/. _site/docs/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
