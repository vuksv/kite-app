# Publishes the report app to GitHub Pages: https://vuksv.github.io/kite-app/
# Works with either Pages source: "GitHub Actions" (this workflow) or "Deploy from a branch".
# Both publish the same tree: web/ (the app), sessions/, docs/, and root redirects
# index.html -> web/ and all.html -> web/all.html.
name: Deploy report app to GitHub Pages
on:
  push:
    branches: [main]
    paths: ["web/**", "index.html", "all.html", "docs/**", "sessions/**", ".github/workflows/pages.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: "Stage site - same layout as deploy-from-branch (app in web/, sessions/ beside it, root redirects)"
        run: |
          mkdir -p _site
          cp index.html all.html .nojekyll _site/
          cp -r web sessions docs _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
